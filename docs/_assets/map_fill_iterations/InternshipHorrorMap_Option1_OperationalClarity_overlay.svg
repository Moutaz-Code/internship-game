  <polygon class="zone-olive" points="1030,675 1290,680 1375,850 1315,1145 1070,1120 970,900"/>

  <path d="M535 482 Q570 495 608 532" fill="none" stroke="#4f9fcd" stroke-width="14" stroke-linecap="round"/>

