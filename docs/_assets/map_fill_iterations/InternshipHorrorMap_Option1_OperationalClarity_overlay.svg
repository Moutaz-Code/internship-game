<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 1600 1600">
  <style>
    .zone-blue{fill:#6fa8dc;fill-opacity:.18}.zone-tan{fill:#d6a85f;fill-opacity:.16}.zone-teal{fill:#63b7b1;fill-opacity:.18}.zone-olive{fill:#9da85b;fill-opacity:.19}.zone-gray{fill:#87929a;fill-opacity:.16}.zone-red{fill:#c95858;fill-opacity:.20}
    .divider{fill:#59636b;fill-opacity:.78;stroke:#111;stroke-width:4}.fixture{fill:#76828a;fill-opacity:.56;stroke:#111;stroke-width:3}
    .label rect{fill:#fff;fill-opacity:.91;stroke:#111;stroke-width:1.5}.label text{fill:#111;font-family:Arial,sans-serif;font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.label .small{font-size:17px}
    .title{fill:#111;font-family:Arial,sans-serif;font-size:28px;font-weight:700}.marker{fill:#7a3db8;stroke:#fff;stroke-width:4}.marker-text{fill:#fff;font-family:Arial,sans-serif;font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
  </style>

  <text class="title" x="56" y="62">OPTION 1 — OPERATIONAL CLARITY</text>

