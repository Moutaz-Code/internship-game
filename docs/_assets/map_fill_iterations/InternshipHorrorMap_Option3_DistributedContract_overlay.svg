<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 1600 1600">
  <style>
    .zone-blue{fill:#6fa8dc;fill-opacity:.18}.zone-tan{fill:#d6a85f;fill-opacity:.17}.zone-teal{fill:#63b7b1;fill-opacity:.20}.zone-olive{fill:#9da85b;fill-opacity:.21}.zone-gray{fill:#87929a;fill-opacity:.20}.zone-green{fill:#67ad6f;fill-opacity:.22}.zone-red{fill:#c95858;fill-opacity:.19}
