<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048">
  <title>Artistic room and environmental theme pass</title>
  <desc>Transparent thematic-zoning and hero-silhouette overlay for the locked Internship Horror Map base.</desc>
  <style>
    .fixture { stroke: #111111; stroke-width: 4; vector-effect: non-scaling-stroke; }
    .concrete { fill: #8f8174; fill-opacity: 0.50; }
    .coolant { fill: #3d9db9; fill-opacity: 0.50; }
    .fuel { fill: #ae8737; fill-opacity: 0.52; }
    .service { fill: #5d8f72; fill-opacity: 0.50; }
    .control { fill: #bf803a; fill-opacity: 0.48; }
    .contractor { fill: #718898; fill-opacity: 0.48; }
    .assay { fill: #63a390; fill-opacity: 0.48; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 500; fill: #111111; paint-order: stroke fill; stroke: #ffffff; stroke-width: 6; stroke-linejoin: round; }
    .small { font-size: 18px; }
    .core { font-size: 24px; letter-spacing: 1px; }
  </style>

  <g id="thematic-zones">
    <path fill="#c58d4b" fill-opacity="0.10" d="M805 50 H1265 V185 H805 Z"/>
    <path fill="#4da7c1" fill-opacity="0.11" d="M1320 275 H1755 L1810 335 V470 L1745 535 H1320 Z"/>
    <path fill="#947e6e" fill-opacity="0.10" d="M892 680 L1055 474 H1190 L1305 680 V1060 L1210 1130 H900 Z"/>
    <path fill="#60987a" fill-opacity="0.10" d="M1518 670 H1695 V1035 H1518 Z"/>
    <path fill="#b58b38" fill-opacity="0.11" d="M1470 1215 L1700 1250 L1665 1418 L1475 1380 Z"/>
    <path fill="#66a591" fill-opacity="0.10" d="M760 1490 H995 V1680 H785 L750 1645 V1530 Z"/>
    <path fill="#748b9a" fill-opacity="0.10" d="M995 1685 H1275 V1840 H995 Z"/>
    <path fill="#7b8e9a" fill-opacity="0.08" d="M1195 1490 H1395 V1660 H1195 Z"/>
    <path fill="#69a27a" fill-opacity="0.09" d="M1555 1635 H1760 V1840 H1555 Z"/>
    <path fill="#9b765b" fill-opacity="0.08" d="M820 340 L985 340 V525 H840 L790 465 Z"/>
  </g>

  <g id="reactor-identity">
    <path d="M862 792 A302 302 0 0 1 862 1013" fill="none" stroke="#278fab" stroke-width="18" stroke-opacity="0.44"/>
    <path d="M874 801 A314 314 0 0 1 874 1004" fill="none" stroke="#111111" stroke-width="3" stroke-opacity="0.72"/>
    <text class="label core" x="420" y="900">INACCESSIBLE REACTOR CORE</text>
    <text class="label small" x="895" y="910">LEAD-GLASS OBSERVATION</text>
  </g>

  <g id="hero-silhouettes">
    <rect class="fixture control" x="1080" y="62" width="64" height="28" rx="4"/>
    <rect class="fixture control" x="1160" y="62" width="64" height="28" rx="4"/>
    <rect class="fixture control" x="1080" y="101" width="144" height="28" rx="4"/>

    <circle class="fixture coolant" cx="1500" cy="390" r="78"/>
    <circle cx="1500" cy="390" r="31" fill="none" stroke="#111111" stroke-width="4"/>
    <rect class="fixture coolant" x="1332" y="325" width="90" height="40" rx="16" transform="rotate(-12 1377 345)"/>
    <rect class="fixture coolant" x="1690" y="350" width="92" height="40" rx="16" transform="rotate(8 1736 370)"/>
    <rect class="fixture coolant" x="1342" y="470" width="94" height="40" rx="16" transform="rotate(12 1389 490)"/>

    <rect class="fixture concrete" x="925" y="700" width="200" height="52" rx="4" transform="rotate(-16 1025 726)"/>
    <rect class="fixture concrete" x="1160" y="738" width="52" height="184" rx="4"/>
    <rect class="fixture concrete" x="948" y="990" width="224" height="52" rx="4" transform="rotate(10 1060 1016)"/>
    <rect class="fixture concrete" x="1260" y="902" width="52" height="158" rx="4"/>

    <rect class="fixture service" x="1568" y="840" width="98" height="78" rx="18"/>
    <line x1="1588" y1="840" x2="1588" y2="918" stroke="#111111" stroke-width="4"/>
    <line x1="1617" y1="840" x2="1617" y2="918" stroke="#111111" stroke-width="4"/>
    <line x1="1646" y1="840" x2="1646" y2="918" stroke="#111111" stroke-width="4"/>

    <rect class="fixture fuel" x="1485" y="1250" width="178" height="28" rx="10"/>
    <rect class="fixture fuel" x="1510" y="1300" width="180" height="28" rx="10"/>

    <rect class="fixture assay" x="790" y="1535" width="74" height="34" rx="5"/>
    <rect class="fixture assay" x="885" y="1535" width="74" height="34" rx="5"/>

    <rect class="fixture contractor" x="1050" y="1740" width="175" height="38" rx="5"/>
    <rect class="fixture contractor" x="1218" y="1550" width="42" height="82" rx="5"/>
    <rect class="fixture contractor" x="1280" y="1550" width="42" height="82" rx="5"/>
  </g>

  <g id="room-names">
    <text class="label small" x="805" y="112">CONTROL</text>
    <text class="label" x="1380" y="295">PRIMARY COOLANT</text>
    <text class="label" x="950" y="640">SHIELD GALLERY</text>
    <text class="label small" x="1540" y="810">AIR FILTRATION</text>
    <text class="label" x="1490" y="1225">FUEL TRANSFER</text>
    <text class="label small" x="775" y="1510">ASSAY LAB</text>
    <text class="label small" x="1210" y="1535">TOOL CRIB</text>
    <text class="label small" x="1050" y="1725">CONTRACTOR DECON</text>
    <text class="label small" x="1570" y="1680">VEHICLE AIRLOCK</text>
  </g>
</svg>
