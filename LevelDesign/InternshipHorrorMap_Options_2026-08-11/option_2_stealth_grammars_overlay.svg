<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048">
  <title>Option 2 — Stealth Grammars overlay</title>
  <desc>Transparent gameplay-grammar overlay for the locked Internship Horror Map base.</desc>
  <style>
    .fixture { stroke: #111111; stroke-width: 4; vector-effect: non-scaling-stroke; }
    .shield { fill: #7a655c; fill-opacity: 0.58; }
    .coolant { fill: #3f9fbd; fill-opacity: 0.52; }
    .fuel { fill: #a98b32; fill-opacity: 0.54; }
    .panel { fill: #e29a32; fill-opacity: 0.86; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 500; fill: #111111; paint-order: stroke fill; stroke: #ffffff; stroke-width: 6; stroke-linejoin: round; }
    .small { font-size: 18px; }
    .marker-label { font-size: 16px; }
    .objective { fill: #8b5cf6; fill-opacity: 0.82; stroke: #111111; stroke-width: 4; }
    .exit { fill: #37a56a; fill-opacity: 0.82; stroke: #111111; stroke-width: 4; }
  </style>

  <g id="grammar-zones">
    <path fill="#c06f49" fill-opacity="0.12" d="M892 680 L1055 474 H1190 L1305 680 V1060 L1210 1130 H900 Z"/>
    <path fill="#45a8c5" fill-opacity="0.12" d="M1320 275 H1755 L1810 335 V470 L1745 535 H1320 Z"/>
    <path fill="#ad9139" fill-opacity="0.12" d="M1470 1215 L1700 1250 L1665 1418 L1475 1380 Z"/>
  </g>

  <g id="reactor-observation">
    <path d="M862 792 A302 302 0 0 1 862 1013" fill="none" stroke="#2596b5" stroke-width="18" stroke-opacity="0.44"/>
    <path d="M874 801 A314 314 0 0 1 874 1004" fill="none" stroke="#111111" stroke-width="3" stroke-opacity="0.72"/>
    <text class="label small" x="894" y="910">REACTOR OBSERVATION</text>
  </g>

  <g id="containment-shields">
    <rect class="fixture shield" x="925" y="700" width="200" height="52" rx="4" transform="rotate(-16 1025 726)"/>
    <rect class="fixture shield" x="1160" y="738" width="52" height="184" rx="4"/>
    <rect class="fixture shield" x="948" y="990" width="224" height="52" rx="4" transform="rotate(10 1060 1016)"/>
    <rect class="fixture shield" x="1260" y="902" width="52" height="158" rx="4"/>
    <text class="label" x="960" y="638">CONTAINMENT</text>
  </g>

  <g id="coolant-machinery">
    <circle class="fixture coolant" cx="1500" cy="390" r="78"/>
    <circle cx="1500" cy="390" r="32" fill="none" stroke="#111111" stroke-width="4"/>
    <rect class="fixture coolant" x="1328" y="325" width="88" height="40" rx="16" transform="rotate(-12 1372 345)"/>
    <rect class="fixture coolant" x="1680" y="345" width="92" height="40" rx="16" transform="rotate(10 1726 365)"/>
    <rect class="fixture coolant" x="1340" y="470" width="96" height="40" rx="16" transform="rotate(12 1388 490)"/>
    <text class="label" x="1380" y="295">COOLANT MAINTENANCE</text>
  </g>

  <g id="fuel-lanes">
    <rect class="fixture fuel" x="1485" y="1235" width="178" height="30" rx="10"/>
    <rect class="fixture fuel" x="1510" y="1285" width="180" height="30" rx="10"/>
    <text class="label" x="1485" y="1210">FUEL HANDLING</text>
  </g>

  <g id="fixed-panels">
    <rect class="fixture panel" x="1080" y="875" width="26" height="26" rx="3"/><text class="label small" x="1115" y="895">TEST</text>
    <rect class="fixture panel" x="1730" y="400" width="26" height="26" rx="3"/><text class="label small" x="1680" y="420">TEST</text>
    <rect class="fixture panel" x="1680" y="1320" width="26" height="26" rx="3"/><text class="label small" x="1625" y="1315">TEST</text>
  </g>

  <g id="objective-markers">
    <circle class="objective" cx="790" cy="1532" r="14"/><text class="label marker-label" x="814" y="1539">ROD A</text>
    <circle class="objective" cx="1640" cy="1360" r="14"/><text class="label marker-label" x="1565" y="1367">ROD B</text>
    <circle class="objective" cx="850" cy="145" r="14"/><text class="label marker-label" x="875" y="151">ROD C</text>
  </g>

</svg>
